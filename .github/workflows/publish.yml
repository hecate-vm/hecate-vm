name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    uses: ./.github/workflows/tests.yml # use the callable tests job to run tests

  release:
    runs-on: ubuntu-latest
    needs: tests
    permissions: write-all
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v2

      - name: Create release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    permissions: write-all
    needs: release
    steps:
      - uses: actions/checkout@v2

      - name: Run tests
        run: cargo test --verbose

      - name: Run build
        run: |
          cargo build --all --release
          strip --strip-all ./target/release/hecate-vm
          tar -czf hecate-linux.tar.gz -C ./target/release/ hecate-vm
          bash ./scripts/build_samples.sh

      - name: Collect Linux release assets
        id: collect-linux-assets
        run: |
          python - <<'PY'
          import glob
          import json
          import os

          assets = ["hecate-linux.tar.gz"]
          assets.extend(sorted(glob.glob("target/hecate-rv32-build/examples-build/**/*.elf", recursive=True)))

          if len(assets) == 1:
            raise SystemExit("No .elf assets found")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"asset_paths={json.dumps(assets)}\n")
          PY

      - name: Upload release
        id: upload-release-linux
        uses: alexellis/upload-assets@0.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_paths: ${{ steps.collect-linux-assets.outputs.asset_paths }}

  build-macos:
    runs-on: macos-latest
    permissions: write-all
    needs: release

    steps:
      - uses: actions/checkout@v2

      - name: Run tests
        run: cargo test --verbose

      - name: Run build
        run: |
          cargo build --all --release
          tar -czf hecate-macos.tar.gz -C ./target/release/ hecate-vm

      - name: Upload release
        id: upload-release-linux
        uses: alexellis/upload-assets@0.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_paths: '["hecate-macos.tar.gz"]'

