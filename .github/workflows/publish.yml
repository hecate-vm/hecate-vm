name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    uses: ./.github/workflows/tests.yml # use the callable tests job to run tests

  release:
    runs-on: ubuntu-latest
    needs: tests
    permissions: write-all
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v2

      - name: Create release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    permissions: write-all
    needs: release
    steps:
      - uses: actions/checkout@v2

      - name: Run tests
        run: cargo test --verbose

      - name: Run build
        run: |
          cargo build --all --release
          strip --strip-all ./target/release/hecate-vm
          tar -czf hecate-linux.tar.gz -C ./target/release/ hecate-vm
          bash ./scripts/build_samples.sh

      - name: Collect Linux release assets
        id: collect-linux-assets
        run: |
          python - <<'PY'
          import glob
          import json
          import os

          assets = ["hecate-linux.tar.gz"]
          assets.extend(sorted(glob.glob("target/hecate-rv32-build/examples-build/**/*.elf", recursive=True)))

          if len(assets) == 1:
            raise SystemExit("No .elf assets found")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"asset_paths={json.dumps(assets)}\n")
          PY

      - name: Upload release
        id: upload-release-linux
        uses: alexellis/upload-assets@0.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_paths: ${{ steps.collect-linux-assets.outputs.asset_paths }}

  build-macos:
    runs-on: macos-latest
    permissions: write-all
    needs: release

    steps:
      - uses: actions/checkout@v2

      - name: Run tests
        run: cargo test --verbose

      - name: Run build
        run: |
          cargo build --all --release
          tar -czf hecate-macos.tar.gz -C ./target/release/ hecate-vm

      - name: Upload release
        id: upload-release-linux
        uses: alexellis/upload-assets@0.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_paths: '["hecate-macos.tar.gz"]'

  build-windows:
    runs-on: windows-2025
    permissions: write-all
    needs: release

    steps:
      - uses: actions/checkout@v2

      - name: Run tests
        run: cargo test --verbose

      - name: Run build
        run: cargo build --all --release

      - name: Create Zip
        run: Compress-Archive -Path ./target/release/*.exe -Destination hecate-windows.zip

      - name: Upload release
        id: upload-release-windows
        uses: alexellis/upload-assets@0.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_paths: '["hecate-windows.zip"]'

  build-pages:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain for wasm
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.105

      - name: Build sample ELFs for browser examples
        run: bash ./scripts/build_samples.sh

      - name: Build wasm runtime
        run: |
          cargo build \
            --manifest-path runtime/rust/hecate_vm_wasm/Cargo.toml \
            --release \
            --target wasm32-unknown-unknown \
            --target-dir target/hecate-wasm-build

      - name: Build GitHub Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/assets/wasm
          mkdir -p _site/examples

          wasm-bindgen \
            --target web \
            --out-dir _site/assets/wasm \
            --out-name hecate_vm_wasm \
            target/hecate-wasm-build/wasm32-unknown-unknown/release/hecate_vm_wasm.wasm

          cp -R src/assets/. _site/

          python - <<'PY'
          import glob
          import os
          import shutil

          built = sorted(glob.glob("target/hecate-rv32-build/examples-build/**/*.elf", recursive=True))
          if not built:
            raise SystemExit("No .elf assets found for pages examples")

          os.makedirs("_site/examples", exist_ok=True)
          for path in built:
            shutil.copy2(path, os.path.join("_site/examples", os.path.basename(path)))
          PY

          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
