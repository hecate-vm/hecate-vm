name: Pages

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_PKG_DIR: target/wasm-pack
  SITE_DIR: site
  ELEMENT_COUNT: 512
  ROUNDS: 10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install sample build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang lld

      - name: Build sample ELFs for browser examples
        run: |
          export HECATE_CMAKE_ARGS_LINKED_LIST="-DELEMENT_COUNT=${ELEMENT_COUNT} -DROUNDS=${ROUNDS}"
          export HECATE_CMAKE_ARGS_VECTOR="-DELEMENT_COUNT=${ELEMENT_COUNT} -DROUNDS=${ROUNDS}"
          HECATE_EXAMPLES=hello_world,linked_list,vector bash scripts/build_samples.sh

      - name: Build wasm package
        run: |
          wasm-pack build --release --target web --out-dir "${WASM_PKG_DIR}" --out-name hecate_vm_wasm

      - name: Verify wasm web entrypoint exists
        run: |
          test -f "${WASM_PKG_DIR}/hecate_vm_wasm.js"
          test -f "${WASM_PKG_DIR}/hecate_vm_wasm_bg.wasm"

      - name: Stage GitHub Pages files
        run: |
          rm -rf "${SITE_DIR}"
          mkdir -p "${SITE_DIR}/assets/wasm" "${SITE_DIR}/examples"
          cp src/assets/index.html "${SITE_DIR}/index.html"
          cp "${WASM_PKG_DIR}"/* "${SITE_DIR}/assets/wasm/"
          cp target/hecate-rv32-build/examples-build/hello_world/hello_world.elf "${SITE_DIR}/examples/"
          cp target/hecate-rv32-build/examples-build/linked_list/linked_list.elf "${SITE_DIR}/examples/"
          cp target/hecate-rv32-build/examples-build/vector/vector.elf "${SITE_DIR}/examples/"
          cat > "${SITE_DIR}/examples/manifest.json" <<'JSON'
          {
            "examples": [
              { "name": "hello_world.elf", "path": "examples/hello_world.elf" },
              { "name": "linked_list.elf", "path": "examples/linked_list.elf" },
              { "name": "vector.elf", "path": "examples/vector.elf" }
            ]
          }
          JSON

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
