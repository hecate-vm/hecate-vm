name: Pages

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_PKG_DIR: target/wasm-pack
  SITE_DIR: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build wasm package
        run: |
          wasm-pack build --target web --out-dir "${WASM_PKG_DIR}"

      - name: Stage GitHub Pages files
        run: |
          rm -rf "${SITE_DIR}"
          mkdir -p "${SITE_DIR}/assets/wasm"
          cp src/assets/index.html "${SITE_DIR}/index.html"
          cp "${WASM_PKG_DIR}"/* "${SITE_DIR}/assets/wasm/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
