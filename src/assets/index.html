<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hecate VM Debug UI</title>
    <style>
        :root {
            --bg: #f4efe7;
            --ink: #1c1b1a;
            --muted: #5a554f;
            --card: #fffaf3;
            --accent: #d14b24;
            --accent-soft: #f8d9d0;
            --ok: #197043;
            --warn: #9a6700;
            --mono: "IBM Plex Mono", "Fira Code", "JetBrains Mono", monospace;
            --display: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 10%, #ffe8c7 0%, transparent 30%),
                radial-gradient(circle at 90% 30%, #fbd9cc 0%, transparent 26%),
                linear-gradient(120deg, #f8f1e8, #f3ece2 40%, #ece3d6);
            font-family: var(--display);
            min-height: 100vh;
            padding: 20px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 14px;
        }

        .card {
            background: var(--card);
            border: 1px solid #eadfce;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(92, 66, 43, 0.08);
            padding: 14px;
            animation: rise 280ms ease-out;
        }

        @keyframes rise {
            from {
                transform: translateY(6px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.3rem, 2.2vw, 2.1rem);
            letter-spacing: 0.02em;
        }

        h2 {
            margin: 0 0 10px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .muted {
            color: var(--muted);
        }

        .mono {
            font-family: var(--mono);
        }

        .mnemonic-link {
            color: #8a2f18;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .mnemonic-link:hover {
            color: #bf3a16;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 9px 12px;
            font-weight: 700;
            cursor: pointer;
            background: var(--accent-soft);
            color: #7c1f08;
        }

        button.primary {
            background: var(--accent);
            color: #fff;
        }

        input,
        select {
            width: 100%;
            border: 1px solid #d8c8b5;
            border-radius: 10px;
            padding: 9px 10px;
            background: #fffdf8;
            color: var(--ink);
            font-family: var(--mono);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .connection-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: end;
        }

        .kv {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 8px;
            margin-bottom: 6px;
            font-family: var(--mono);
            font-size: 0.92rem;
        }

        pre {
            margin: 0;
            border-radius: 10px;
            border: 1px solid #eadfce;
            background: #fff;
            padding: 10px;
            max-height: 280px;
            overflow: auto;
            font-family: var(--mono);
            font-size: 0.84rem;
            line-height: 1.35;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 800;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .running {
            background: #d6f3e4;
            color: var(--ok);
        }

        .paused {
            background: #fef0d5;
            color: var(--warn);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 980px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .connection-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="card" style="margin-bottom:14px;">
        <h1>Hecate VM Debug Console <span id="status-pill" class="status paused">Paused</span></h1>
    </div>

    <div class="layout">
        <section class="card">
            <h2>Program & Control</h2>

            <div>
                <label class="muted" for="ws-url">Websocket URL</label>
                <div class="connection-row">
                    <input id="ws-url" placeholder="ws://127.0.0.1:8582" />
                    <button class="primary" id="btn-connect">Connect</button>
                </div>
            </div>

            <div id="examples-block" style="margin-top:10px;">
                <label class="muted" for="example-select" id="examples-label">Examples</label>
                <select id="example-select"></select>
            </div>

            <input id="file-picker" type="file" accept=".elf,application/octet-stream" class="hidden" />

            <div class="controls">
                <button class="primary" id="btn-load">Upload ELF</button>
                <button class="primary" id="btn-run">Run</button>
                <button id="btn-pause">Pause</button>
                <button id="btn-step">Step</button>
                <button id="btn-reset">Reset</button>
            </div>

            <div class="row">
                <div>
                    <label class="muted" for="step-count">Step count</label>
                    <input id="step-count" value="1" />
                </div>
                <div>
                    <label class="muted" for="refresh-ms">Refresh ms</label>
                    <input id="refresh-ms" value="250" />
                </div>
            </div>

            <div style="margin-top:10px;" class="mono" id="msg"></div>

            <h2 style="margin-top:14px;">Memory Inspector</h2>
            <div class="row">
                <div>
                    <label class="muted" for="mem-addr">Address</label>
                    <input id="mem-addr" value="0x00000000" />
                </div>
                <div>
                    <label class="muted" for="mem-len">Length</label>
                    <input id="mem-len" value="64" />
                </div>
            </div>
            <div class="controls">
                <button id="btn-read-mem">Read Memory</button>
            </div>
            <pre id="mem-view">(empty)</pre>
        </section>

        <section class="card">
            <h2>Live Snapshot</h2>
            <div class="kv">
                <div>PC</div>
                <div id="pc" class="mono"></div>
            </div>
            <div class="kv">
                <div>Entry</div>
                <div id="entry" class="mono"></div>
            </div>
            <div class="kv">
                <div>Loaded Binary</div>
                <div id="loaded" class="mono"></div>
            </div>
            <div class="kv">
                <div>Stop Reason</div>
                <div id="stop" class="mono"></div>
            </div>
            <div class="kv">
                <div>Current Instruction</div>
                <div id="instr" class="mono"></div>
            </div>
            <div class="kv">
                <div>Cycles</div>
                <div id="cycles" class="mono"></div>
            </div>
            <div class="kv">
                <div>Instructions</div>
                <div id="instret" class="mono"></div>
            </div>
            <div class="kv">
                <div>Syscalls</div>
                <div id="syscalls" class="mono"></div>
            </div>

            <h2 style="margin-top:14px;">Registers</h2>
            <pre id="regs"></pre>
        </section>
    </div>

    <script>
        const categories = {
            "arithmetic": ["add", "addi", "neg", "sub", "mul", "mulh", "mulhu", "mulhsu", "div", "rem"],
            "bitwise-logic": ["and", "andi", "not", "or", "ori", "xor", "xori"],
            "shift": ["sll", "slli", "srl", "srli", "sra", "srai"],
            "load-immediate": ["li", "lui", "auipc"],
            "jump-and-function": ["j", "jal", "jalr", "call", "ret"],
            "branch": ["beq", "beqz", "bne", "bnez", "blt", "bltu", "bltz", "bgt", "bgtu", "bgtz", "ble", "bleu", "blez", "bge", "bgeu", "bgez"],
            "set": ["slt", "slti", "sltu", "sltiu", "seqz", "snez", "sltz", "sgtz"],
            "counters": ["rdcycle", "rdcycleh", "rdtime", "rdtimeh", "rdinstret", "rdinstreth"],
            "misc-instructions": ["ebreak", "ecall", "fence", "mv", "nop"]
        };

        let seq = 1;
        let timer = null;
        let adapter = null;
        let currentSnapshot = null;
        let availableExamples = [];
        let lastExamplesSignature = null;

        function formatHex32(value) {
            return `0x${(Number(value || 0) >>> 0).toString(16).padStart(8, '0')}`;
        }

        function formatStopReason(stopReason) {
            if (!stopReason) {
                return '(unknown)';
            }
            if (typeof stopReason === 'string') {
                return stopReason;
            }

            const kind = String(stopReason.kind || 'unknown');
            const detail = stopReason.detail;
            switch (kind) {
                case 'breakpoint':
                    return `Breakpoint @ ${formatHex32(detail && detail.pc)}`;
                case 'cpuError':
                    return `CPU Error: ${(detail && detail.error) || 'unknown'}`;
                default:
                    return kind.replace(/[A-Z]/g, (m) => ` ${m.toLowerCase()}`).replace(/^./, (c) => c.toUpperCase());
            }
        }

        function showMsg(text, isError = false) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.style.color = isError ? '#a1260d' : '#2f6b4f';
        }

        function parseMaybeHex(raw) {
            const v = String(raw || '').trim();
            if (v.startsWith('0x') || v.startsWith('0X')) return Number.parseInt(v, 16);
            return Number.parseInt(v, 10);
        }

        function docsUrlForMnemonic(mnemonic) {
            for (const category in categories) {
                if (categories[category].includes(mnemonic)) {
                    return `https://projectf.io/posts/riscv-cheat-sheet/#${category}`;
                }
            }
            return `https://duckduckgo.com/?q=${encodeURIComponent(`RISC-V ${mnemonic} instruction`)}`;
        }

        function renderInstructionWithLink(rawInstruction) {
            const container = document.getElementById('instr');
            container.textContent = '';

            const text = String(rawInstruction || 'Unavailable').trim();
            const match = text.match(/^([a-z][a-z0-9.]*)\b(.*)$/i);
            if (!match) {
                container.textContent = text;
                return;
            }

            const mnemonic = match[1];
            const rest = match[2] || '';

            const link = document.createElement('a');
            link.className = 'mnemonic-link';
            link.href = docsUrlForMnemonic(mnemonic);
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = mnemonic;

            container.appendChild(link);
            container.appendChild(document.createTextNode(rest));
        }

        function renderRegs(regs, pc) {
            let out = '';
            for (let i = 0; i < regs.length; i++) {
                const name = 'x' + String(i).padStart(2, '0');
                const v = (regs[i] >>> 0).toString(16).padStart(8, '0');
                out += `${name}: 0x${v}${i % 2 ? '\n' : '    '}`;
            }
            out += `\npc: 0x${(pc >>> 0).toString(16).padStart(8, '0')}`;
            return out;
        }

        function updateStatusPill(running) {
            const el = document.getElementById('status-pill');
            el.className = 'status ' + (running ? 'running' : 'paused');
            el.textContent = running ? 'Running' : 'Paused';
        }

        function isGitHubPages() {
            return window.location.hostname.endsWith('github.io');
        }

        function defaultWsUrl() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.hostname || '127.0.0.1';
            const port = Number.parseInt(window.location.port || '0', 10);
            const wsPort = Number.isFinite(port) && port > 0 ? String(port + 1) : '8582';
            return `${protocol}//${host}:${wsPort}`;
        }

        function bytesToBase64(bytes) {
            let binary = '';
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                const chunk = bytes.subarray(i, i + chunkSize);
                binary += String.fromCharCode(...chunk);
            }
            return btoa(binary);
        }

        function wait(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        function isPagesSite() {
            return window.location.hostname === 'hecate-vm.github.io' || window.location.hostname.endsWith('.github.io');
        }

        function makeWasmAdapter() {
            let runtime = null;
            let initialized = false;

            async function ensureRuntime() {
                if (runtime) {
                    return runtime;
                }

                const moduleUrl = new URL('assets/wasm/hecate_vm_wasm.js', window.location.href).href;
                const module = await import(moduleUrl);
                if (!initialized && typeof module.default === 'function') {
                    const wasmBinaryUrl = new URL('assets/wasm/hecate_vm_wasm_bg.wasm', window.location.href).href;
                    await module.default(wasmBinaryUrl);
                    initialized = true;
                }
                if (module.createHecateVm) {
                    runtime = await module.createHecateVm();
                } else if (module.HecateVmWasm) {
                    runtime = new module.HecateVmWasm();
                } else {
                    throw new Error('WASM module missing createHecateVm/HecateVmWasm export');
                }
                return runtime;
            }

            async function control(commandName, args = {}) {
                const wasm = await ensureRuntime();
                if (commandName === 'launchBytes') {
                    args = {
                        name: args.name,
                        bytesBase64: bytesToBase64(args.bytes),
                    };
                }

                const response = await wasm.control({ id: seq++, command: commandName, arguments: args });
                if (!response.success) {
                    throw new Error(response.message || 'request failed');
                }
                return response.body || {};
            }

            return {
                kind: 'wasm',
                async connect() {
                    await ensureRuntime();
                },
                disconnect() { },
                async command(commandName, args = {}) {
                    return await control(commandName, args);
                },
                async listExamples() {
                    const body = await control('examples');
                    return body.examples || [];
                },
            };
        }

        async function loadStaticExamples() {
            const manifestUrl = new URL('examples/manifest.json', window.location.href).href;
            const response = await fetch(manifestUrl, { cache: 'no-store' });
            if (!response.ok) {
                return [];
            }

            const manifest = await response.json();
            const items = Array.isArray(manifest.examples) ? manifest.examples : [];
            return items
                .filter((entry) => entry && typeof entry.name === 'string' && typeof entry.path === 'string')
                .map((entry) => ({
                    name: entry.name,
                    path: entry.path,
                    staticUrl: new URL(entry.path, window.location.href).href,
                }));
        }

        function makeRemoteAdapter(wsUrl) {
            let ws = null;
            const pending = new Map();

            async function connect() {
                return await new Promise((resolve, reject) => {
                    const socket = new WebSocket(wsUrl);
                    const timeout = setTimeout(() => {
                        socket.close();
                        reject(new Error(`websocket connect timeout: ${wsUrl}`));
                    }, 1000);

                    socket.onopen = () => {
                        clearTimeout(timeout);
                        ws = socket;

                        socket.onmessage = (event) => {
                            let data = null;
                            try {
                                data = JSON.parse(event.data);
                            } catch (error) {
                                return;
                            }
                            const id = data.id ?? data.seq;
                            if (!pending.has(id)) {
                                return;
                            }
                            const entry = pending.get(id);
                            pending.delete(id);
                            if (data.success) {
                                entry.resolve(data.body || {});
                            } else {
                                entry.reject(new Error(data.message || 'request failed'));
                            }
                        };

                        socket.onclose = () => {
                            ws = null;
                            for (const entry of pending.values()) {
                                entry.reject(new Error('websocket disconnected'));
                            }
                            pending.clear();
                        };

                        resolve();
                    };

                    socket.onerror = () => {
                        clearTimeout(timeout);
                        reject(new Error(`websocket connection failed: ${wsUrl}`));
                    };
                });
            }

            async function command(command, args = {}) {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    throw new Error('websocket is not connected');
                }

                const id = seq++;
                const payload = JSON.stringify({ id, command, arguments: args });
                return await new Promise((resolve, reject) => {
                    pending.set(id, { resolve, reject });
                    ws.send(payload);
                });
            }

            return {
                kind: 'remote',
                connect,
                disconnect() {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.close();
                    }
                    ws = null;
                },
                async command(commandName, args = {}) {
                    if (commandName === 'launchBytes') {
                        return await command(commandName, {
                            name: args.name,
                            bytesBase64: bytesToBase64(args.bytes),
                        });
                    }
                    return await command(commandName, args);
                },
                async listExamples() {
                    const body = await command('examples');
                    return body.examples || [];
                },
            };
        }

        async function setActiveAdapter(nextAdapter, message) {
            if (adapter && typeof adapter.disconnect === 'function') {
                adapter.disconnect();
            }
            adapter = nextAdapter;
            await adapter.connect();
            restartTimer();
            availableExamples = await adapter.listExamples().catch(() => []);
            if (adapter.kind === 'wasm' && availableExamples.length === 0) {
                availableExamples = await loadStaticExamples().catch(() => []);
            }
            renderExamples();
            if (message) {
                showMsg(message);
            }
            await refresh();
        }

        async function connectToRemote(wsUrl) {
            const remoteAdapter = makeRemoteAdapter(wsUrl);
            let lastError = null;
            for (let attempt = 0; attempt < 5; attempt++) {
                try {
                    await setActiveAdapter(remoteAdapter, `Connected to ${wsUrl}`);
                    return;
                } catch (error) {
                    lastError = error;
                    if (attempt < 4) {
                        await wait(250);
                    }
                }
            }
            throw lastError || new Error(`websocket connection failed: ${wsUrl}`);
        }

        async function fallbackToWasm(message) {
            await setActiveAdapter(makeWasmAdapter(), message || 'WASM runtime initialized');
        }

        async function connectToRemoteOrFallback(wsUrl, fallbackMessage) {
            try {
                await connectToRemote(wsUrl);
            } catch (error) {
                await fallbackToWasm(fallbackMessage || `Could not connect to ${wsUrl}; using WASM instead`);
            }
        }

        async function control(command, args = {}) {
            if (!adapter) {
                throw new Error('No active adapter');
            }
            return await adapter.command(command, args);
        }

        function extractState(body) {
            if (!body || typeof body !== 'object') {
                return null;
            }
            if (body.state && typeof body.state === 'object') {
                return body.state;
            }
            if (typeof body.pc !== 'undefined' && Array.isArray(body.registers)) {
                return body;
            }
            return null;
        }

        function extractEntryHex(body) {
            if (!body || typeof body !== 'object') {
                return null;
            }
            if (typeof body.entryHex === 'string') {
                return body.entryHex;
            }
            const state = extractState(body);
            if (state && typeof state.entryPoint !== 'undefined') {
                return formatHex32(state.entryPoint);
            }
            return null;
        }

        function currentLoadedExampleName() {
            const loaded = (currentSnapshot && currentSnapshot.loadedBinaryName) || '';
            const match = availableExamples.find((example) => example.name === loaded || example.path === loaded);
            return match ? match.name : '';
        }

        function renderExamples() {
            const block = document.getElementById('examples-block');
            const select = document.getElementById('example-select');
            if (!availableExamples.length) {
                block.classList.add('hidden');
                if (lastExamplesSignature !== 'hidden') {
                    select.innerHTML = '';
                    lastExamplesSignature = 'hidden';
                }
                return;
            }

            block.classList.remove('hidden');
            const selectedExample = currentLoadedExampleName();
            const signature = JSON.stringify({
                examples: availableExamples,
                selectedExample,
            });
            if (signature === lastExamplesSignature) {
                return;
            }

            const options = ['<option value="">-</option>'];
            for (const item of availableExamples) {
                const selected = item.name === selectedExample ? ' selected' : '';
                options.push(`<option value="${item.path}"${selected}>${item.name}</option>`);
            }
            select.innerHTML = options.join('');
            if (!selectedExample) {
                select.value = '';
            }
            lastExamplesSignature = signature;
        }

        async function confirmBeforeReplacingBinary() {
            const instret = Number((currentSnapshot && currentSnapshot.stats && currentSnapshot.stats.instret) || 0);
            if (instret === 0) {
                return true;
            }
            return window.confirm('The current VM has already executed instructions. Load a different binary anyway?');
        }

        async function refresh() {
            if (!adapter) {
                return;
            }
            try {
                if (adapter.kind === 'wasm' && currentSnapshot && currentSnapshot.running) {
                    await control('tick', { quantum: 5_000 });
                }

                const body = await control('state');
                const state = extractState(body);
                if (!state) {
                    return;
                }

                currentSnapshot = state;
                updateStatusPill(!!state.running);
                document.getElementById('pc').textContent = formatHex32(state.pc);
                document.getElementById('entry').textContent = formatHex32(state.entryPoint);
                document.getElementById('loaded').textContent = state.loadedBinaryName || '(none)';
                document.getElementById('stop').textContent = formatStopReason(state.stopReason);
                renderInstructionWithLink((state.currentInstruction && state.currentInstruction.text) || 'Unavailable');
                document.getElementById('cycles').textContent = String(state.stats.cycles);
                document.getElementById('instret').textContent = String(state.stats.instret);
                document.getElementById('syscalls').textContent = String(state.stats.syscall_count);
                document.getElementById('regs').textContent = renderRegs(state.registers, state.pc);
                renderExamples();
            } catch (error) {
                showMsg(error.message || String(error), true);
            }
        }

        function restartTimer() {
            if (timer) {
                clearInterval(timer);
            }
            const ms = Math.max(50, parseMaybeHex(document.getElementById('refresh-ms').value) || 250);
            timer = setInterval(refresh, ms);
        }

        async function loadExample(path) {
            const body = await control('launch', { path });
            showMsg(`Loaded example: ${path}`);
            const entryHex = extractEntryHex(body);
            if (entryHex) {
                showMsg(`Loaded example: ${path} @ ${entryHex}`);
            }
            await refresh();
        }

        async function loadStaticExample(example) {
            if (!example || !example.staticUrl) {
                throw new Error('invalid static example entry');
            }

            const response = await fetch(example.staticUrl, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`failed to fetch example ${example.name}: HTTP ${response.status}`);
            }

            const bytes = new Uint8Array(await response.arrayBuffer());
            const body = await control('launchBytes', { name: example.name, bytes });
            const entryHex = extractEntryHex(body);
            showMsg(`Loaded example: ${example.name}${entryHex ? ` @ ${entryHex}` : ''}`);
            await refresh();
        }

        async function loadUploadedFile(file) {
            const bytes = new Uint8Array(await file.arrayBuffer());
            const body = await control('launchBytes', { name: file.name, bytes });
            const entryHex = extractEntryHex(body);
            showMsg(`Loaded binary: ${file.name}${entryHex ? ` @ ${entryHex}` : ''}`);
            await refresh();
        }

        document.getElementById('btn-connect').addEventListener('click', async () => {
            const wsUrl = document.getElementById('ws-url').value.trim();
            if (!wsUrl) {
                showMsg('Please enter a websocket URL', true);
                return;
            }
            try {
                await connectToRemote(wsUrl);
            } catch (error) {
                showMsg(error.message || String(error), true);
            }
        });

        document.getElementById('example-select').addEventListener('change', async (event) => {
            const selected = event.target.value;
            if (!selected) {
                return;
            }

            const selectedEntry = availableExamples.find((example) => example.path === selected || example.name === selected);

            if (!(await confirmBeforeReplacingBinary())) {
                renderExamples();
                return;
            }

            try {
                if (selectedEntry && selectedEntry.staticUrl) {
                    await loadStaticExample(selectedEntry);
                } else {
                    await loadExample(selected);
                }
            } catch (error) {
                showMsg(error.message || String(error), true);
                renderExamples();
            }
        });

        document.getElementById('btn-load').addEventListener('click', () => {
            const picker = document.getElementById('file-picker');
            picker.value = '';
            picker.click();
        });

        document.getElementById('file-picker').addEventListener('change', async (event) => {
            const file = event.target.files?.[0];
            if (!file) {
                return;
            }

            if (!(await confirmBeforeReplacingBinary())) {
                event.target.value = '';
                return;
            }

            try {
                await loadUploadedFile(file);
            } catch (error) {
                showMsg(error.message || String(error), true);
            } finally {
                event.target.value = '';
            }
        });

        document.getElementById('btn-run').addEventListener('click', async () => {
            try {
                await control('continue');
                showMsg('Running');
                await refresh();
            } catch (error) {
                showMsg(error.message || String(error), true);
            }
        });

        document.getElementById('btn-pause').addEventListener('click', async () => {
            try {
                await control('pause');
                showMsg('Paused');
                await refresh();
            } catch (error) {
                showMsg(error.message || String(error), true);
            }
        });

        document.getElementById('btn-step').addEventListener('click', async () => {
            try {
                const count = Math.max(1, parseMaybeHex(document.getElementById('step-count').value) || 1);
                await control('next', { count });
                await refresh();
            } catch (error) {
                showMsg(error.message || String(error), true);
            }
        });

        document.getElementById('btn-reset').addEventListener('click', async () => {
            try {
                await control('restart');
                showMsg('Reset complete');
                await refresh();
            } catch (error) {
                showMsg(error.message || String(error), true);
            }
        });

        document.getElementById('btn-read-mem').addEventListener('click', async () => {
            const addr = parseMaybeHex(document.getElementById('mem-addr').value);
            const len = parseMaybeHex(document.getElementById('mem-len').value);
            try {
                const body = await control('readMemory', { addr, len });
                const result = body.result || {};
                const bytes = result.bytes || [];
                const lines = [];
                for (let i = 0; i < bytes.length; i += 16) {
                    const row = bytes.slice(i, i + 16).map((b) => Number(b).toString(16).padStart(2, '0')).join(' ');
                    const rowAddr = ((result.addr || addr) + i) >>> 0;
                    lines.push(`0x${rowAddr.toString(16).padStart(8, '0')}: ${row}`);
                }
                document.getElementById('mem-view').textContent = lines.join('\n') || '(empty)';
                if (result.kind === 'partial') {
                    showMsg(`Partial memory read: requested ${result.requested_len} bytes, received ${result.available_len}`);
                }
            } catch (error) {
                showMsg(error.message || String(error), true);
            }
        });

        document.getElementById('refresh-ms').addEventListener('change', restartTimer);

        async function boot() {
            const wsUrl = defaultWsUrl();
            document.getElementById('ws-url').value = wsUrl;
            showMsg('UI ready. Connecting to the local VM...');

            await wait(0);
            if (isPagesSite()) {
                await fallbackToWasm('GitHub Pages detected; using the in-browser VM');
                return;
            }

            await connectToRemoteOrFallback(wsUrl);
        }

        boot().catch((error) => {
            showMsg(error.message || String(error), true);
        });
    </script>
</body>

</html>
