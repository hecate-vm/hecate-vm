<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hecate VM Debug UI</title>
    <style>
        :root {
            --bg: #f4efe7;
            --ink: #1c1b1a;
            --muted: #5a554f;
            --card: #fffaf3;
            --accent: #d14b24;
            --accent-soft: #f8d9d0;
            --ok: #197043;
            --warn: #9a6700;
            --mono: "IBM Plex Mono", "Fira Code", "JetBrains Mono", monospace;
            --display: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 10%, #ffe8c7 0%, transparent 30%),
                radial-gradient(circle at 90% 30%, #fbd9cc 0%, transparent 26%),
                linear-gradient(120deg, #f8f1e8, #f3ece2 40%, #ece3d6);
            font-family: var(--display);
            min-height: 100vh;
            padding: 20px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 14px;
        }

        .card {
            background: var(--card);
            border: 1px solid #eadfce;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(92, 66, 43, 0.08);
            padding: 14px;
            animation: rise 280ms ease-out;
        }

        @keyframes rise {
            from {
                transform: translateY(6px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.3rem, 2.2vw, 2.1rem);
            letter-spacing: 0.02em;
        }

        h2 {
            margin: 0 0 10px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .muted {
            color: var(--muted);
        }

        .mono {
            font-family: var(--mono);
        }

        .mnemonic-link {
            color: #8a2f18;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .mnemonic-link:hover {
            color: #bf3a16;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 9px 12px;
            font-weight: 700;
            cursor: pointer;
            background: var(--accent-soft);
            color: #7c1f08;
        }

        button.primary {
            background: var(--accent);
            color: #fff;
        }

        input {
            width: 100%;
            border: 1px solid #d8c8b5;
            border-radius: 10px;
            padding: 9px 10px;
            background: #fffdf8;
            color: var(--ink);
            font-family: var(--mono);
        }

        select {
            width: 100%;
            border: 1px solid #d8c8b5;
            border-radius: 10px;
            padding: 9px 10px;
            background: #fffdf8;
            color: var(--ink);
            font-family: var(--mono);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .kv {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 8px;
            margin-bottom: 6px;
            font-family: var(--mono);
            font-size: 0.92rem;
        }

        pre {
            margin: 0;
            border-radius: 10px;
            border: 1px solid #eadfce;
            background: #fff;
            padding: 10px;
            max-height: 280px;
            overflow: auto;
            font-family: var(--mono);
            font-size: 0.84rem;
            line-height: 1.35;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 800;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .running {
            background: #d6f3e4;
            color: var(--ok);
        }

        .paused {
            background: #fef0d5;
            color: var(--warn);
        }

        @media (max-width: 980px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="card" style="margin-bottom:14px;">
        <h1>Hecate VM Debug Console <span id="status-pill" class="status paused">Paused</span></h1>
    </div>

    <div class="layout">
        <section class="card">
            <h2>Program & Control</h2>
            <div class="row">
                <div>
                    <label class="muted" for="mode">Execution mode</label>
                    <select id="mode">
                        <option value="local">Connect to local Hecate VM</option>
                        <option value="wasm">Run in browser (WASM)</option>
                    </select>
                </div>
                <div>
                    <label class="muted" for="ws-port">Local websocket port</label>
                    <input id="ws-port" value="8582" />
                </div>
            </div>

            <label class="muted" for="example-select" style="margin-top:10px; display:block;">Examples</label>
            <select id="example-select"></select>

            <label class="muted" for="bin-path">Binary path on host</label>
            <input id="bin-path" placeholder="/abs/path/to/program.elf" />

            <div class="controls">
                <button class="primary" id="btn-load">Load</button>
                <button class="primary" id="btn-run">Run</button>
                <button id="btn-pause">Pause</button>
                <button id="btn-step">Step 1</button>
                <button id="btn-reset">Reset</button>
            </div>

            <div class="row">
                <div>
                    <label class="muted" for="step-count">Step count</label>
                    <input id="step-count" value="1" />
                </div>
                <div>
                    <label class="muted" for="refresh-ms">Refresh ms</label>
                    <input id="refresh-ms" value="250" />
                </div>
            </div>

            <div style="margin-top:10px;" class="mono" id="msg"></div>

            <h2 style="margin-top:14px;">Memory Inspector</h2>
            <div class="row">
                <div>
                    <label class="muted" for="mem-addr">Address</label>
                    <input id="mem-addr" value="0x00000000" />
                </div>
                <div>
                    <label class="muted" for="mem-len">Length</label>
                    <input id="mem-len" value="64" />
                </div>
            </div>
            <div class="controls">
                <button id="btn-read-mem">Read Memory</button>
            </div>
            <pre id="mem-view">(empty)</pre>
        </section>

        <section class="card">
            <h2>Live Snapshot</h2>
            <div class="kv">
                <div>PC</div>
                <div id="pc" class="mono"></div>
            </div>
            <div class="kv">
                <div>Entry</div>
                <div id="entry" class="mono"></div>
            </div>
            <div class="kv">
                <div>Loaded Binary</div>
                <div id="loaded" class="mono"></div>
            </div>
            <div class="kv">
                <div>Stop Reason</div>
                <div id="stop" class="mono"></div>
            </div>
            <div class="kv">
                <div>Current Instruction</div>
                <div id="instr" class="mono"></div>
            </div>
            <div class="kv">
                <div>Cycles</div>
                <div id="cycles" class="mono"></div>
            </div>
            <div class="kv">
                <div>Instructions</div>
                <div id="instret" class="mono"></div>
            </div>
            <div class="kv">
                <div>Syscalls</div>
                <div id="syscalls" class="mono"></div>
            </div>

            <h2 style="margin-top:14px;">Registers</h2>
            <pre id="regs"></pre>
        </section>
    </div>

    <script>
        const categories = {
            "arithmetic": [
                "add",
                "addi",
                "neg",
                "sub",
                "mul",
                "mulh",
                "mulhu",
                "mulhsu",
                "div",
                "rem"
            ],
            "bitwise-logic": [
                "and",
                "andi",
                "not",
                "or",
                "ori",
                "xor",
                "xori"
            ],
            "shift": [
                "sll",
                "slli",
                "srl",
                "srli",
                "sra",
                "srai"
            ],
            "load-immediate": [
                "li",
                "lui",
                "auipc"
            ],
            "jump-and-function": [
                "j",
                "jal",
                "jalr",
                "call",
                "ret"
            ],
            "branch": [
                "beq",
                "beqz",
                "bne",
                "bnez",
                "blt",
                "bltu",
                "bltz",
                "bgt",
                "bgtu",
                "bgtz",
                "ble",
                "bleu",
                "blez",
                "bge",
                "bgeu",
                "bgez"
            ],
            "set": [
                "slt",
                "slti",
                "sltu",
                "sltiu",
                "seqz",
                "snez",
                "sltz",
                "sgtz"
            ],
            "counters": [
                "rdcycle",
                "rdcycleh",
                "rdtime",
                "rdtimeh",
                "rdinstret",
                "rdinstreth"
            ],
            "misc-instructions": [
                "ebreak",
                "ecall",
                "fence",
                "mv",
                "nop"
            ]
        };

        let seq = 1;
        let timer = null;
        let adapter = null;

        function showMsg(text, isError = false) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.style.color = isError ? '#a1260d' : '#2f6b4f';
        }

        function parseMaybeHex(raw) {
            const v = String(raw || '').trim();
            if (v.startsWith('0x') || v.startsWith('0X')) return Number.parseInt(v, 16);
            return Number.parseInt(v, 10);
        }

        function docsUrlForMnemonic(mnemonic) {
            for (const category in categories) {
                if (categories[category].includes(mnemonic)) {
                    return `https://projectf.io/posts/riscv-cheat-sheet/#${category}`;
                }
            }
            return `https://duckduckgo.com/?q=${encodeURIComponent(`RISC-V ${mnemonic} instruction`)}`;
        }

        function renderInstructionWithLink(rawInstruction) {
            const container = document.getElementById('instr');
            container.textContent = '';

            const text = String(rawInstruction || 'Unavailable').trim();
            const match = text.match(/^([a-z][a-z0-9.]*)\b(.*)$/i);
            if (!match) {
                container.textContent = text;
                return;
            }

            const mnemonic = match[1];
            const rest = match[2] || '';

            const link = document.createElement('a');
            link.className = 'mnemonic-link';
            link.href = docsUrlForMnemonic(mnemonic);
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = mnemonic;

            container.appendChild(link);
            container.appendChild(document.createTextNode(rest));
        }

        function renderRegs(regs, pc) {
            let out = '';
            for (let i = 0; i < regs.length; i++) {
                const name = 'x' + String(i).padStart(2, '0');
                const v = (regs[i] >>> 0).toString(16).padStart(8, '0');
                out += `${name}: 0x${v}${i % 2 ? '\n' : '    '}`;
            }
            out += `\npc: 0x${(pc >>> 0).toString(16).padStart(8, '0')}`;
            return out;
        }

        function updateStatusPill(running) {
            const el = document.getElementById('status-pill');
            el.className = 'status ' + (running ? 'running' : 'paused');
            el.textContent = running ? 'Running' : 'Paused';
        }

        function makeHttpControl() {
            return async function httpControl(command, args = {}) {
                const payload = {
                    id: seq++,
                    command,
                    arguments: args,
                };
                const res = await fetch('/api/v1/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const body = await res.json();
                if (!body.success) {
                    throw new Error(body.message || 'request failed');
                }
                return body.body || {};
            };
        }

        function makeLocalAdapter() {
            const httpControl = makeHttpControl();
            let ws = null;
            const pending = new Map();

            async function connectWs() {
                const wsPort = parseMaybeHex(document.getElementById('ws-port').value) || 8582;
                const wsUrl = `ws://127.0.0.1:${wsPort}`;

                return await new Promise((resolve, reject) => {
                    const socket = new WebSocket(wsUrl);
                    const timeout = setTimeout(() => {
                        socket.close();
                        reject(new Error('websocket connect timeout'));
                    }, 800);

                    socket.onopen = () => {
                        clearTimeout(timeout);
                        ws = socket;

                        socket.onmessage = (ev) => {
                            let data = null;
                            try {
                                data = JSON.parse(ev.data);
                            } catch {
                                return;
                            }
                            const id = data.id ?? data.seq;
                            if (!pending.has(id)) {
                                return;
                            }
                            const entry = pending.get(id);
                            pending.delete(id);
                            if (data.success) {
                                entry.resolve(data.body || {});
                            } else {
                                entry.reject(new Error(data.message || 'request failed'));
                            }
                        };

                        socket.onclose = () => {
                            ws = null;
                            for (const entry of pending.values()) {
                                entry.reject(new Error('websocket disconnected'));
                            }
                            pending.clear();
                        };

                        resolve();
                    };

                    socket.onerror = () => {
                        clearTimeout(timeout);
                        reject(new Error('websocket connection failed'));
                    };
                });
            }

            async function command(command, args = {}) {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    return await httpControl(command, args);
                }

                const id = seq++;
                const payload = JSON.stringify({ id, command, arguments: args });
                return await new Promise((resolve, reject) => {
                    pending.set(id, { resolve, reject });
                    ws.send(payload);
                });
            }

            async function listExamples() {
                const res = await fetch('/api/v1/examples');
                if (!res.ok) {
                    return [];
                }
                const body = await res.json();
                return body.examples || [];
            }

            return {
                connect: async () => {
                    try {
                        await connectWs();
                        showMsg('Connected over websocket');
                    } catch {
                        showMsg('Websocket unavailable, using HTTP fallback');
                    }
                },
                command,
                listExamples,
            };
        }

        function makeWasmAdapter() {
            let vm = null;

            async function ensureVm() {
                if (vm) {
                    return vm;
                }

                const module = await import('./assets/wasm/hecate_vm_wasm.js');
                if (module.createHecateVm) {
                    vm = await module.createHecateVm();
                } else if (module.HecateVmWasm) {
                    vm = new module.HecateVmWasm();
                } else {
                    throw new Error('WASM module missing createHecateVm/HecateVmWasm export');
                }
                return vm;
            }

            async function listExamples() {
                const res = await fetch('/assets/examples.json');
                if (!res.ok) {
                    return [];
                }
                const body = await res.json();
                return body.examples || [];
            }

            async function command(command, args = {}) {
                const runtime = await ensureVm();

                if (typeof runtime.control === 'function') {
                    const rsp = await runtime.control({ id: seq++, command, arguments: args });
                    if (!rsp.success) {
                        throw new Error(rsp.message || 'WASM command failed');
                    }
                    return rsp.body || {};
                }

                if (command === 'launch' || command === 'load') {
                    const path = args.path;
                    if (!path) {
                        throw new Error('Missing path for launch');
                    }
                    const res = await fetch(path);
                    if (!res.ok) {
                        throw new Error(`Failed to fetch example: ${path}`);
                    }
                    const bytes = new Uint8Array(await res.arrayBuffer());
                    if (typeof runtime.loadBytes !== 'function') {
                        throw new Error('WASM runtime is missing loadBytes(bytes, path)');
                    }
                    return await runtime.loadBytes(bytes, path);
                }

                if (typeof runtime.command !== 'function') {
                    throw new Error('WASM runtime is missing command(command, args)');
                }
                return await runtime.command(command, args);
            }

            return {
                connect: async () => {
                    await ensureVm();
                    showMsg('WASM runtime initialized');
                },
                command,
                listExamples,
            };
        }

        async function populateExamples() {
            const select = document.getElementById('example-select');
            select.innerHTML = '';

            const none = document.createElement('option');
            none.value = '';
            none.textContent = '(manual path)';
            select.appendChild(none);

            if (!adapter) {
                return;
            }

            let examples = [];
            try {
                examples = await adapter.listExamples();
            } catch {
                examples = [];
            }

            for (const item of examples) {
                const opt = document.createElement('option');
                opt.value = item.path;
                opt.textContent = item.name;
                select.appendChild(opt);
            }
        }

        async function switchMode() {
            const mode = document.getElementById('mode').value;
            adapter = mode === 'wasm' ? makeWasmAdapter() : makeLocalAdapter();

            const pathInput = document.getElementById('bin-path');
            pathInput.placeholder = mode === 'wasm' ? 'hello_world.elf' : '/abs/path/to/program.elf';

            try {
                await adapter.connect();
            } catch (err) {
                showMsg(err.message || String(err), true);
            }

            await populateExamples();
            await refresh();
        }

        async function control(command, args = {}) {
            if (!adapter) {
                throw new Error('No active adapter');
            }
            return await adapter.command(command, args);
        }

        async function refresh() {
            try {
                const body = await control('state');
                const s = body.state;
                if (!s) {
                    return;
                }

                updateStatusPill(!!s.running);
                document.getElementById('pc').textContent = s.pc_hex;
                document.getElementById('entry').textContent = s.entry_hex;
                document.getElementById('loaded').textContent = s.loaded_path || '(none)';
                document.getElementById('stop').textContent = s.last_stop_reason;
                renderInstructionWithLink(s.current_instruction);
                document.getElementById('cycles').textContent = String(s.stats.cycles);
                document.getElementById('instret').textContent = String(s.stats.instret);
                document.getElementById('syscalls').textContent = String(s.stats.syscall_count);
                document.getElementById('regs').textContent = renderRegs(s.registers, s.pc);
            } catch (err) {
                showMsg(err.message || String(err), true);
            }
        }

        function restartTimer() {
            if (timer) clearInterval(timer);
            const ms = Math.max(50, parseMaybeHex(document.getElementById('refresh-ms').value) || 250);
            timer = setInterval(refresh, ms);
        }

        document.getElementById('mode').addEventListener('change', switchMode);

        document.getElementById('ws-port').addEventListener('change', async () => {
            if (document.getElementById('mode').value === 'local') {
                await switchMode();
            }
        });

        document.getElementById('example-select').addEventListener('change', () => {
            const selected = document.getElementById('example-select').value;
            if (selected) {
                document.getElementById('bin-path').value = selected;
            }
        });

        document.getElementById('btn-load').addEventListener('click', async () => {
            const selected = document.getElementById('example-select').value;
            const path = (selected || document.getElementById('bin-path').value || '').trim();
            if (!path) {
                showMsg('Please choose an example or provide a path', true);
                return;
            }

            try {
                const body = await control('launch', { path });
                showMsg(`Loaded: entry ${body.entry_hex || ''}`);
                await refresh();
            } catch (err) {
                showMsg(err.message || String(err), true);
            }
        });

        document.getElementById('btn-run').addEventListener('click', async () => {
            try {
                await control('continue');
                showMsg('Running');
            } catch (err) {
                showMsg(err.message || String(err), true);
            }
        });

        document.getElementById('btn-pause').addEventListener('click', async () => {
            try {
                await control('pause');
                showMsg('Paused');
                await refresh();
            } catch (err) {
                showMsg(err.message || String(err), true);
            }
        });

        document.getElementById('btn-step').addEventListener('click', async () => {
            try {
                const count = Math.max(1, parseMaybeHex(document.getElementById('step-count').value) || 1);
                await control('next', { count });
                await refresh();
            } catch (err) {
                showMsg(err.message || String(err), true);
            }
        });

        document.getElementById('btn-reset').addEventListener('click', async () => {
            try {
                await control('restart');
                showMsg('Reset complete');
                await refresh();
            } catch (err) {
                showMsg(err.message || String(err), true);
            }
        });

        document.getElementById('btn-read-mem').addEventListener('click', async () => {
            const addr = parseMaybeHex(document.getElementById('mem-addr').value);
            const len = parseMaybeHex(document.getElementById('mem-len').value);
            try {
                const body = await control('readMemory', { addr, len });
                const bytes = body.bytes || [];
                let lines = [];
                for (let i = 0; i < bytes.length; i += 16) {
                    const row = bytes.slice(i, i + 16).map(b => Number(b).toString(16).padStart(2, '0')).join(' ');
                    const rowAddr = (body.addr + i) >>> 0;
                    lines.push(`0x${rowAddr.toString(16).padStart(8, '0')}: ${row}`);
                }
                document.getElementById('mem-view').textContent = lines.join('\n') || '(empty)';
            } catch (err) {
                showMsg(err.message || String(err), true);
            }
        });

        document.getElementById('refresh-ms').addEventListener('change', restartTimer);

        restartTimer();
        switchMode();
    </script>
</body>

</html>
