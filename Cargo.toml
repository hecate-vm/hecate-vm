[package]
name = "hecate-vm"
version = "0.6.0"
edition = "2021"
description = "The main package for the hecate vm"
license-file = "LICENSE"
repository = "https://github.com/hecate-vm/hecate-vm"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.22", features = ["derive"] }
rvsim = { git = "https://github.com/hecate-vm/rvsim", version = "0.2.2" }

[features]
default = []

[workspace]
members = ["crates/common"]
