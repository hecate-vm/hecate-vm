[package]
name = "hecate-vm"
version = "0.6.0"
edition = "2021"
description = "The main package for the hecate vm"
license-file = "LICENSE"
repository = "https://github.com/hecate-vm/hecate-vm"

[dependencies]
anyhow = "1.0.95"
byteorder = "1.5.0"
clap = { version = "4.5.22", features = ["derive"] }
hecate-common = { version = "0.4.0", path = "crates/common" }
num-derive = "0.4.2"
num-traits = "0.2.19"
macroquad = "0.4.13"
rvsim = { git = "https://github.com/hecate-vm/rvsim", version = "0.2.2" }

[features]
default = []
experimental_ui = []

[workspace]
members = ["crates/common"]
